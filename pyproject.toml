[project]
name = "assignment"
version = "0.1.0"
description = "COMP64501 Topics in Machine Learning"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "torch>=2.9.0",
    "torchvision>=0.24.0",
]

# Development tools: installed by `uv sync`, but not in the Docker image
[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
]

# Use the CPU-only PyTorch build on Linux (and so in Docker): the CUDA build adds about 4 GB
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
